spring.application.name=motosphere-backend

#DB config
spring.datasource.url=jdbc:mysql://localhost:3306/motosphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sql123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
logging.level.root=info

#JWT
jwt.secret.key=6f1a9c3e8b5d2047af6f1a9c3e8b5d2047af6f1a9c3e8b5d2047af6f1a9c3e8b
jwt.expiration.time=7200000

#Business rules
invoice.gst.percentage=18

#File uploads - garage gallery photos are stored on local disk (not a cloud
#bucket, since this is a local dev setup) under this directory, which is
#created automatically on first upload if it doesn't exist.
motosphere.uploads.dir=uploads/garage-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#CORS - comma-separated origins allowed to call this API. Vite's dev server
#defaults to 5173; add your deployed frontend's real origin(s) alongside it,
#e.g. https://app.motosphere.com
motosphere.cors.allowed-origins=http://localhost:5173

#Email (SMTP) - used to email the invoice after a successful payment.
#For Gmail: turn on 2FA on the account, then generate an "App Password" at
#https://myaccount.google.com/apppasswords and use THAT as spring.mail.password
#(your normal Gmail login password will NOT work here).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sandeepdolare01@gmail.com
spring.mail.password=tkewxbtaxaskmalz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=sandeepdolare01@gmail.com

#payment-service - this backend's own base URL for the *other* service, plus
#the shared secret both sides use to authenticate service-to-service calls
#(see InternalApiKeyGuard / payment-service's equivalent). Must be the SAME
#value in payment-service's application.properties.
payment.service.base-url=http://localhost:8081
internal.api.key=a-long-random-shared-secret-change-me
