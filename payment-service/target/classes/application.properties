spring.application.name=payment-service
server.port=8081

#Separate MySQL database from motosphere-backend - genuinely independent
#storage, not just a second table set in the same schema.
spring.datasource.url=jdbc:mysql://localhost:3306/motosphere_payments?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

#JWT - MUST be the exact same secret as motosphere-backend's jwt.secret.key,
#since this service independently validates the same tokens issued by that
#service's /auth/login (no shared auth server - each service just trusts the
#same signing key).
jwt.secret.key=6f1a9c3e8b5d2047af6f1a9c3e8b5d2047af6f1a9c3e8b5d2047af6f1a9c3e8b

#Core (motosphere-backend) connection - this service's own base URL for the
#*other* service, plus the shared secret both sides use for
#service-to-service calls. Must match motosphere-backend's internal.api.key.
core.service.base-url=http://localhost:8080
internal.api.key=a-long-random-shared-secret-change-me

#Feign's default HTTP client can't send PATCH requests (it's built on
#HttpURLConnection, which rejects PATCH outright). markInvoicePaid() in
#CoreServiceFeignClient is a PATCH call, so this MUST be true - combined with
#the feign-okhttp dependency in pom.xml - or that call will fail on every
#attempt without any visible error (see CoreServiceClient's retry/swallow
#logic).
feign.okhttp.enabled=true

#Razorpay - get test-mode keys from https://dashboard.razorpay.com/app/keys
#(use the TEST keys while developing - they start with rzp_test_)
razorpay.key.id=rzp_test_TJOWm1xmIug9m7
razorpay.key.secret=OwoE04T63Wfc1jLPhgCMFFbe

#CORS - same frontend origin as motosphere-backend, since the browser calls
#this service directly for payment endpoints.
motosphere.cors.allowed-origins=http://localhost:5173
